
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joke Corner | Random Joke Fetcher</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f7f4ff;
            color: #30264a;
            min-height: 100vh;
            padding: 30px 16px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo {
            display: inline-block;
            background: #ede9fe;
            color: #6d28d9;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        h1 {
            font-size: clamp(28px, 5vw, 38px);
            color: #6d28d9;
            margin-bottom: 10px;
        }

        header p {
            color: #817694;
            font-size: 15px;
        }

        .joke-card {
            background: white;
            border: 1px solid #e8e0fa;
            border-radius: 24px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 12px 35px rgba(91, 33, 182, 0.08);
        }

        .emoji {
            font-size: 52px;
            margin-bottom: 12px;
        }

        .label {
            color: #8b5cf6;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #jokeSetup {
            font-size: 21px;
            font-weight: 600;
            line-height: 1.6;
            margin: 18px 0;
        }

        #jokePunch {
            color: #7c3aed;
            font-size: 19px;
            font-weight: bold;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 13px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
            transform: none;
        }

        #loadBtn {
            background: #7c3aed;
            color: white;
        }

        #loadBtn:hover {
            background: #6d28d9;
        }

        #saveBtn {
            display: none;
            background: #d1fae5;
            color: #065f46;
        }

        #loading {
            display: none;
            margin-top: 22px;
            color: #817694;
            font-size: 14px;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 4px solid #ede9fe;
            border-top-color: #7c3aed;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #errorMsg {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 10px;
            background: #fff1f2;
            color: #be123c;
            font-size: 14px;
            line-height: 1.5;
        }

        .favourites {
            margin-top: 25px;
            padding: 24px;
            background: white;
            border: 1px solid #e8e0fa;
            border-radius: 20px;
        }

        .favourites-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            padding-bottom: 14px;
            border-bottom: 1px solid #eee8f8;
        }

        h2 {
            color: #44305f;
            font-size: 19px;
        }

        #favCount {
            background: #ede9fe;
            color: #6d28d9;
            padding: 5px 11px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        #favouritesList {
            list-style: none;
            margin-top: 15px;
        }

        #favouritesList li {
            background: #faf8ff;
            padding: 13px;
            border-radius: 10px;
            margin-bottom: 10px;
            color: #55466d;
            font-size: 14px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .empty {
            color: #9589a9 !important;
            text-align: center;
        }

        footer {
            text-align: center;
            color: #9589a9;
            font-size: 12px;
            margin-top: 22px;
        }

        @media (max-width: 450px) {
            .joke-card {
                padding: 25px 17px;
            }

            .buttons button {
                width: 100%;
            }

            .favourites {
                padding: 18px;
            }
        }
    </style>
</head>

<body>
    <main class="container">

        <header>
            <div class="logo">✨ YOUR DAILY DOSE OF FUN</div>
            <h1>Welcome to Joke Corner!</h1>
            <p>Take a break and brighten your day with a random joke.</p>
        </header>

        <section class="joke-card">
            <div class="emoji">😂</div>
            <div class="label">Ready for a laugh?</div>

            <div id="jokeSetup" aria-live="polite">
                Click "Load Joke" to discover something funny!
            </div>

            <div id="jokePunch"></div>

            <div class="buttons">
                <button id="loadBtn">🎲 Load Joke</button>
                <button id="saveBtn">⭐ Save Favourite</button>
            </div>

            <div id="loading" role="status" aria-live="polite">
                <div class="spinner"></div>
                Loading…
            </div>

            <div id="errorMsg" role="alert"></div>
        </section>

        <section class="favourites">
            <div class="favourites-header">
                <h2>💜 My Favourite Jokes</h2>
                <span id="favCount">0 saved</span>
            </div>

            <ul id="favouritesList">
                <li class="empty">No favourites saved yet.</li>
            </ul>
        </section>

        <footer>
            Made with 💜 and a little sense of humour.
        </footer>

    </main>

    <script>
        const loadBtn = document.getElementById("loadBtn");
        const saveBtn = document.getElementById("saveBtn");
        const loading = document.getElementById("loading");
        const errorMsg = document.getElementById("errorMsg");
        const jokeSetup = document.getElementById("jokeSetup");
        const jokePunch = document.getElementById("jokePunch");
        const favouritesList = document.getElementById("favouritesList");
        const favCount = document.getElementById("favCount");

        let currentJoke = null;

        loadBtn.addEventListener("click", loadJoke);
        saveBtn.addEventListener("click", saveFavourite);

        // Fetch a random joke from the API
        async function loadJoke() {
            errorMsg.style.display = "none";
            saveBtn.style.display = "none";

            jokeSetup.textContent = "";
            jokePunch.textContent = "";
            currentJoke = null;

            loading.style.display = "block";
            loadBtn.disabled = true;

            try {
                const response = await fetch(
                    "https://official-joke-api.appspot.com/random_joke"
                );

                if (!response.ok) {
                    throw new Error("The server could not load a joke.");
                }

                const data = await response.json();

                if (
                    !data ||
                    !data.setup ||
                    !data.punchline ||
                    data.id == null
                ) {
                    throw new Error("Invalid joke data.");
                }

                currentJoke = data;

                // Display setup and punchline separately
                jokeSetup.textContent = data.setup;
                jokePunch.textContent = data.punchline;

                saveBtn.style.display = "inline-block";

            } catch (error) {
                errorMsg.textContent =
                    "Oops! We couldn't load a joke. Please check your internet connection and try again.";

                errorMsg.style.display = "block";
                console.error("Fetch error:", error);

            } finally {
                loading.style.display = "none";
                loadBtn.disabled = false;
            }
        }

        // Save the current joke to localStorage
        function saveFavourite() {
            if (!currentJoke) return;

            let favourites = getFavourites();

            const alreadySaved = favourites.some(
                joke => joke.id === currentJoke.id
            );

            if (alreadySaved) {
                alert("This joke is already in your favourites!");
                return;
            }

            favourites.push(currentJoke);

            try {
                localStorage.setItem(
                    "favouriteJokes",
                    JSON.stringify(favourites)
                );

                displayFavourites();

            } catch (error) {
                alert("Sorry, we couldn't save this favourite.");
            }
        }

        // Read saved favourites
        function getFavourites() {
            try {
                const saved = JSON.parse(
                    localStorage.getItem("favouriteJokes") || "[]"
                );

                return Array.isArray(saved) ? saved : [];

            } catch (error) {
                return [];
            }
        }

        // Show all saved jokes
        function displayFavourites() {
            const favourites = getFavourites();

            favouritesList.replaceChildren();
            favCount.textContent = favourites.length + " saved";

            if (favourites.length === 0) {
                const item = document.createElement("li");
                item.className = "empty";
                item.textContent = "No favourites saved yet.";
                favouritesList.appendChild(item);
                return;
            }

            for (const joke of favourites) {
                const item = document.createElement("li");

                item.textContent =
                    "😂 " + joke.setup + " — " + joke.punchline;

                favouritesList.appendChild(item);
            }
        }

        // Restore saved favourites when the page opens
        displayFavourites();
    </script>
</body>
</html>
