
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Stream Explorer | Prashna Rai</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f8f6ff;
      --card-bg: rgba(255, 255, 255, 0.88);
      --card-border: #e7ddff;
      --purple: #8b5cf6;
      --violet: #a78bfa;
      --pink: #ec4899;
      --amber: #f59e0b;
      --text: #30234b;
      --muted: #817494;
      --soft-purple: #f0eaff;
      --font-display: 'Syne', sans-serif;
      --font-body: 'Space Grotesk', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
      padding: 3rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 16px;
    }

    .aurora-mesh {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .aurora-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(110px);
      opacity: 0.4;
      animation: float 14s infinite alternate ease-in-out;
    }

    .blob-1 {
      width: 450px;
      height: 450px;
      background: #d8b4fe;
      top: -10%;
      left: 5%;
    }

    .blob-2 {
      width: 500px;
      height: 500px;
      background: #fbcfe8;
      bottom: -15%;
      right: 5%;
      animation-delay: -5s;
    }

    .blob-3 {
      width: 350px;
      height: 350px;
      background: #c4b5fd;
      top: 40%;
      left: 50%;
      opacity: 0.3;
      animation-delay: -9s;
    }

    @keyframes float {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(40px, 35px) scale(1.12); }
    }

    .app-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
    }

    .header-bento {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      border-radius: var(--radius);
      padding: 2.75rem;
      position: relative;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(107, 70, 193, 0.09);
    }

    .header-bento::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--purple), var(--pink), var(--violet));
    }

    .tagline {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--purple);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 600;
    }

    .tagline::before {
      content: '';
      width: 9px;
      height: 9px;
      background: var(--purple);
      border-radius: 50%;
      box-shadow: 0 0 12px #c4b5fd;
    }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 5vw, 3.2rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.15;
      background: linear-gradient(135deg, #6d28d9, #c026d3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }

    .header-bento p {
      color: var(--muted);
      font-size: 1.08rem;
      line-height: 1.7;
      max-width: 680px;
    }

    .control-deck {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 0.9rem;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 1rem;
      box-shadow: 0 10px 30px rgba(107, 70, 193, 0.07);
    }

    .filter-input,
    .select-limit {
      min-width: 0;
      background: #fbfaff;
      border: 1px solid #e4dcf7;
      border-radius: 12px;
      padding: 0.9rem 1rem;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 0.95rem;
      outline: none;
      transition: 0.2s ease;
    }

    .filter-input:focus,
    .select-limit:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.13);
    }

    .select-limit {
      font-family: var(--font-mono);
      cursor: pointer;
    }

    .btn-fire {
      background: linear-gradient(135deg, #8b5cf6, #a855f7);
      color: white;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      border-radius: 12px;
      padding: 0.9rem 1.35rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      white-space: nowrap;
    }

    .btn-fire:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(139, 92, 246, 0.25);
    }

    .btn-fire:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .posts-stream {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .post-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      border-radius: var(--radius);
      padding: 2rem;
      position: relative;
      transition: 0.25s ease;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(107, 70, 193, 0.05);
    }

    .post-panel:hover {
      border-color: #c4b5fd;
      transform: translateY(-3px);
      box-shadow: 0 14px 32px rgba(107, 70, 193, 0.1);
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.15rem;
    }

    .author-pill {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .avatar-dot {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
    }

    .badge-index {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 0.4rem 0.7rem;
      border-radius: 30px;
      background: var(--soft-purple);
      border: 1px solid #ddd0ff;
      color: #7c3aed;
      font-weight: 600;
      white-space: nowrap;
    }

    .post-title {
      font-family: var(--font-display);
      font-size: 1.45rem;
      font-weight: 700;
      line-height: 1.4;
      color: #49346b;
      margin-bottom: 0.8rem;
      text-transform: capitalize;
    }

    .post-content {
      color: #756783;
      font-size: 1rem;
      line-height: 1.8;
    }

    .comments-toggle {
      background: transparent;
      border: none;
      color: #7c3aed;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      cursor: pointer;
      margin-top: 1.3rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0;
      transition: color 0.2s;
    }

    .comments-toggle:hover {
      color: #c026d3;
    }

    .comments-drawer {
      margin-top: 1.25rem;
      padding-top: 1.25rem;
      border-top: 1px solid #eee7fb;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .comment-bubble {
      background: #faf8ff;
      border: 1px solid #ece5fa;
      border-left: 4px solid var(--violet);
      border-radius: 12px;
      padding: 1rem 1.15rem;
    }

    .comment-sender {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: #7c3aed;
      margin-bottom: 0.4rem;
      font-weight: 600;
    }

    .comment-text {
      font-size: 0.95rem;
      color: #756783;
      line-height: 1.65;
      overflow-wrap: anywhere;
    }

    .status-stage {
      text-align: center;
      padding: 4rem 1.5rem;
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.8);
      border: 1px dashed #d8c9f5;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.15rem;
    }

    .status-stage h3 {
      font-family: var(--font-display);
      font-size: 1.35rem;
      color: var(--text);
      margin-bottom: 0.4rem;
    }

    .status-stage p {
      font-size: 1rem;
      line-height: 1.6;
    }

    .status-icon {
      font-size: 3rem;
    }

    .pulse-ring {
      width: 48px;
      height: 48px;
      border: 4px solid #e9ddff;
      border-top-color: var(--purple);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .site-footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 0.5rem 0 1rem;
    }

    .site-footer strong {
      color: #7c3aed;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 680px) {
      body {
        padding: 1.5rem 1rem;
      }

      .header-bento {
        padding: 1.8rem;
      }

      .control-deck {
        grid-template-columns: 1fr;
      }

      .post-panel {
        padding: 1.4rem;
      }

      .post-title {
        font-size: 1.25rem;
      }

      .post-header {
        align-items: flex-start;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="aurora-mesh" aria-hidden="true">
    <div class="aurora-blob blob-1"></div>
    <div class="aurora-blob blob-2"></div>
    <div class="aurora-blob blob-3"></div>
  </div>

  <div class="app-wrapper">
    <header class="header-bento">
      <div class="tagline">Async Pipeline • Live REST Client</div>
      <h1>Data Stream Explorer</h1>
      <p>
        Fetch mock records from JSONPlaceholder, search through posts,
        and explore the comments connected to each record.
      </p>
    </header>

    <section class="control-deck" aria-label="Post controls">
      <input
        type="search"
        id="filterInput"
        class="filter-input"
        placeholder="Search posts by keyword..."
        autocomplete="off"
        aria-label="Filter loaded posts"
      >

      <select id="limitSelect" class="select-limit" aria-label="Number of posts">
        <option value="6">06 Records</option>
        <option value="12" selected>12 Records</option>
        <option value="24">24 Records</option>
      </select>

      <button id="triggerBtn" class="btn-fire" type="button">
        Fetch Records
      </button>
    </section>

    <main id="streamContainer" class="posts-stream" aria-live="polite">
      <div class="status-stage">
        <div class="status-icon">✨</div>
        <div>
          <h3>Ready to Explore</h3>
          <p>Click “Fetch Records” to load posts from the API.</p>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      Created by <strong>Prashna Rai</strong> | Week 6 - Friday Task 4
    </footer>
  </div>

  <script>
    const streamContainer = document.getElementById("streamContainer");
    const triggerBtn = document.getElementById("triggerBtn");
    const limitSelect = document.getElementById("limitSelect");
    const filterInput = document.getElementById("filterInput");

    let allPosts = [];
    let abortCtrl = null;
    let requestNumber = 0;

    const userColors = [
      "#8b5cf6",
      "#a855f7",
      "#ec4899",
      "#6366f1",
      "#d946ef",
      "#7c3aed",
      "#c084fc",
      "#9333ea"
    ];

    function sanitize(value) {
      const element = document.createElement("span");
      element.textContent = String(value);
      return element.innerHTML;
    }

    async function fetchStream() {
      if (abortCtrl) {
        abortCtrl.abort();
      }

      abortCtrl = new AbortController();
      const thisRequest = ++requestNumber;
      const count = limitSelect.value;

      triggerBtn.disabled = true;
      triggerBtn.textContent = "Fetching...";

      streamContainer.innerHTML = `
        <div class="status-stage">
          <div class="pulse-ring"></div>
          <div>
            <h3>Loading Records</h3>
            <p>Fetching ${count} posts from JSONPlaceholder...</p>
          </div>
        </div>
      `;

      try {
        const response = await fetch(
          `https://jsonplaceholder.typicode.com/posts?_limit=${count}`,
          { signal: abortCtrl.signal }
        );

        if (!response.ok) {
          throw new Error(`Request failed with status ${response.status}.`);
        }

        const posts = await response.json();

        if (thisRequest !== requestNumber) return;

        allPosts = posts;
        renderPosts(allPosts);
      } catch (error) {
        if (error.name === "AbortError") return;
        if (thisRequest !== requestNumber) return;

        streamContainer.innerHTML = `
          <div class="status-stage">
            <div class="status-icon">⚠️</div>
            <div>
              <h3>Unable to Load Records</h3>
              <p>${sanitize(error.message)}</p>
              <p>Please check your internet connection and try again.</p>
            </div>
          </div>
        `;
      } finally {
        if (thisRequest === requestNumber) {
          triggerBtn.disabled = false;
          triggerBtn.textContent = "Fetch Records";
        }
      }
    }

    function renderPosts(posts) {
      streamContainer.replaceChildren();

      if (posts.length === 0) {
        streamContainer.innerHTML = `
          <div class="status-stage">
            <div class="status-icon">🔎</div>
            <div>
              <h3>No Matching Posts</h3>
              <p>Try a different keyword.</p>
            </div>
          </div>
        `;
        return;
      }

      posts.forEach((post, index) => {
        const color = userColors[(post.userId - 1) % userColors.length];
        const article = document.createElement("article");

        article.className = "post-panel";

        article.innerHTML = `
          <div class="post-header">
            <div class="author-pill">
              <div class="avatar-dot" style="background:${color}">
                U${post.userId}
              </div>
              <span>Author ID: ${post.userId}</span>
            </div>
            <span class="badge-index">POST ${String(post.id).padStart(3, "0")}</span>
          </div>

          <h2 class="post-title">${sanitize(post.title)}</h2>
          <p class="post-content">${sanitize(post.body)}</p>

          <button
            class="comments-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="comments-${post.id}"
          >
            <span>＋</span> Load Comments
          </button>

          <div
            class="comments-drawer"
            id="comments-${post.id}"
            hidden
          ></div>
        `;

        const commentsButton = article.querySelector(".comments-toggle");
        const commentsDrawer = article.querySelector(".comments-drawer");

        commentsButton.addEventListener("click", async () => {
          if (!commentsDrawer.hidden) {
            commentsDrawer.hidden = true;
            commentsButton.setAttribute("aria-expanded", "false");
            commentsButton.innerHTML = "<span>＋</span> Load Comments";
            return;
          }

          commentsDrawer.hidden = false;
          commentsButton.setAttribute("aria-expanded", "true");

          if (commentsDrawer.dataset.loaded === "true") {
            commentsButton.innerHTML = "<span>−</span> Hide Comments";
            return;
          }

          commentsButton.textContent = "Loading comments...";

          try {
            const response = await fetch(
              `https://jsonplaceholder.typicode.com/posts/${post.id}/comments`
            );

            if (!response.ok) {
              throw new Error("Could not load comments.");
            }

            const comments = await response.json();

            commentsDrawer.replaceChildren();

            if (comments.length === 0) {
              commentsDrawer.textContent = "No comments found.";
            } else {
              comments.forEach(comment => {
                const bubble = document.createElement("div");
                bubble.className = "comment-bubble";

                const sender = document.createElement("div");
                sender.className = "comment-sender";
                sender.textContent = comment.name;

                const email = document.createElement("div");
                email.className = "comment-sender";
                email.textContent = comment.email;

                const text = document.createElement("p");
                text.className = "comment-text";
                text.textContent = comment.body;

                bubble.append(sender, email, text);
                commentsDrawer.appendChild(bubble);
              });
            }

            commentsDrawer.dataset.loaded = "true";
            commentsButton.innerHTML = "<span>−</span> Hide Comments";
          } catch (error) {
            commentsDrawer.textContent =
              "Unable to load comments. Please try again.";
            commentsButton.innerHTML = "<span>↻</span> Retry Comments";
          }
        });

        streamContainer.appendChild(article);
      });
    }

    function filterPosts() {
      const keyword = filterInput.value.trim().toLowerCase();

      const filteredPosts = allPosts.filter(post =>
        post.title.toLowerCase().includes(keyword) ||
        post.body.toLowerCase().includes(keyword) ||
        String(post.userId).includes(keyword) ||
        String(post.id).includes(keyword)
      );

      renderPosts(filteredPosts);
    }

    triggerBtn.addEventListener("click", fetchStream);
    filterInput.addEventListener("input", filterPosts);

    limitSelect.addEventListener("change", () => {
      if (allPosts.length > 0) {
        fetchStream();
      }
    });
  </script>
</body>
</html>
