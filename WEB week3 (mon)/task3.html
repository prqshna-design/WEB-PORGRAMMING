<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task 3</title>

  <style>
    .swatches {
      display: flex;
      gap: 12px;
    }

    .swatch {
      padding: 30px 20px;
      color: white;
      font-weight: bold;
      border-radius: 8px;
      text-align: center;
    }

    .color1 {
      background-color: #ef4444;
    }

    .color2 {
      background-color: #f59e0b;
    }

    .color3 {
      background-color: #10b981;
    }

    .color4 {
      background-color: #3b82f6;
    }

    .color5 {
      background-color: #8b5cf6;
    }
  </style>
</head>
<body>

  <h1>Colour Swatches</h1>

  <div class="swatches">
    <div class="swatch color1">#EF4444</div>
    <div class="swatch color2">#F59E0B</div>
    <div class="swatch color3">#10B981</div>
    <div class="swatch color4">#3B82F6</div>
    <div class="swatch color5">#8B5CF6</div>
  </div>

</body>
</html>
