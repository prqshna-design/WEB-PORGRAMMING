<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task 7</title>

  <style>
    body {
      margin: 0;
      background-color: #f1f5f9;
      font-family: sans-serif;
    }

    .card {
      width: 350px;
      background-color: white;
      margin: 80px auto;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
    }

    .avatar {
      width: 80px;
      height: 80px;
      background-color: #16a34a;
      color: white;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2rem;
      font-weight: bold;
      margin: 0 auto 15px;
    }

    .name {
      font-size: 1.5rem;
      font-weight: bold;
      margin: 10px 0;
    }

    .role {
      color: #64748b;
    }

    hr {
      border: none;
      border-top: 1px solid #e2e8f0;
      margin: 25px 0;
    }

    .skills {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .skill {
      background-color: #16a34a;
      color: white;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="card">

    <div class="avatar">P</div>

    <div class="name">Prashna Rai</div>

    <div class="role">Computer Science Student</div>

    <hr>

    <div class="skills">
      <div class="skill">HTML</div>
      <div class="skill">CSS</div>
      <div class="skill">Python</div>
    </div>

  </div>

</body>
</html>
