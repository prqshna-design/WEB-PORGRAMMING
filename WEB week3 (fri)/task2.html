<!DOCTYPE html>
<html>
<head>
    <title>Task 2 - Hover Card</title>

    <style>
        .card {
            width: 280px;
            padding: 25px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 128, 128, 0.2);

            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 25px rgba(0, 128, 128, 0.4);
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Hover Me</h2>
        <p>Move your mouse over this card.</p>
    </div>

</body>
</html>
