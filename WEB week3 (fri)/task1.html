<!DOCTYPE html>
<html>
<head>
    <title>Task 1 - Sale Card</title>

    <style>
        .card {
            width: 280px;
            height: 180px;
            background-color: white;
            border: 2px solid teal;
            border-radius: 12px;
            position: relative;
            padding: 20px;
            box-sizing: border-box;
        }

        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: teal;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="badge">SALE</div>

        <h2>Special Offer</h2>
        <p>Get 20% off today!</p>
    </div>

</body>
</html>
