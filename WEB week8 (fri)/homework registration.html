
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JS Validation</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px 15px;
    background: #160e21;
    color: white;
    font-family: Arial, sans-serif;
}

main {
    max-width: 560px;
    margin: auto;
    padding: 30px;
    background: #21152e;
    border: 1px solid #7530a8;
    border-radius: 18px;
}

h1 {
    text-align: center;
    color: #d78aff;
}

.description {
    text-align: center;
    color: #b8a7ca;
    margin-bottom: 25px;
}

.group {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

input:not([type="checkbox"]):not([type="range"]),
select {
    width: 100%;
    padding: 13px;
    border: 1px solid #a66be0;
    border-radius: 10px;
    background: #170f22;
    color: white;
    font-size: 15px;
}

input:focus, select:focus {
    outline: 3px solid #a85be8;
}

input[type="checkbox"] {
    accent-color: #a52de2;
}

input[type="range"] {
    width: 100%;
    accent-color: #a52de2;
}

.hint {
    display: block;
    margin-top: 6px;
    color: #bba7ce;
    font-size: 13px;
}

.error {
    color: #ff8585;
    font-size: 13px;
    margin-top: 6px;
}

.error[hidden] {
    display: none;
}

#message {
    padding: 12px;
    border-radius: 8px;
    font-weight: bold;
}

#message:empty {
    display: none;
}

#message.success {
    background: #16452d;
    color: #8cffb4;
}

#message.fail {
    background: #4b2029;
    color: #ffaaaa;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #912be0, #d238e6);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.85;
}

#studentResult {
    margin-top: 18px;
    text-align: center;
    color: #d78aff;
    font-weight: bold;
}

@media(max-width: 450px) {
    main {
        padding: 20px;
    }
}
</style>
</head>

<body>

<main>
    <h1>Student Registration</h1>

    <p class="description">
        Complete the form to register and generate your student ID.
    </p>

    <form id="registerForm" novalidate>

        <div class="group">
            <label for="name">Full Name *</label>
            <input type="text" id="name" required minlength="2">
            <div class="error" id="nameError" hidden></div>
        </div>

        <div class="group">
            <label for="email">Institutional Email *</label>
            <input type="email" id="email"
                   placeholder="student@gachon.ac.kr" required>
            <span class="hint">
                Accepted: @gachon.ac.kr, @snu.ac.kr, @kaist.ac.kr
            </span>
            <div class="error" id="emailError" hidden></div>
        </div>

        <div class="group">
            <label for="password">Password *</label>
            <input type="password" id="password"
                   required minlength="8">
            <div class="error" id="passwordError" hidden></div>
        </div>

        <div class="group">
            <label for="confirmPassword">Confirm Password *</label>
            <input type="password" id="confirmPassword" required>
            <div class="error" id="confirmError" hidden></div>
        </div>

        <div class="group">
            <label for="phone">Phone Number (Optional)</label>
            <input type="tel" id="phone"
                   placeholder="010-1234-5678"
                   pattern="010-[0-9]{4}-[0-9]{4}">
            <div class="error" id="phoneError" hidden></div>
        </div>

        <div class="group">
            <label for="experience">
                Coding Experience:
                <span id="experienceValue">1 year</span>
            </label>

            <input type="range" id="experience"
                   min="0" max="5" value="1">

            <span class="hint">
                Beginner — Experienced — Expert
            </span>
        </div>

        <div class="group">
            <label>
                <input type="checkbox" id="agreement">
                I agree to the Academic Code of Honor and registration terms. *
            </label>
            <div class="error" id="agreementError" hidden></div>
        </div>

        <p id="message" role="alert" aria-live="polite"></p>

        <button type="submit">
            Register & Generate Student ID ✨
        </button>

        <div id="studentResult" aria-live="polite"></div>

    </form>
</main>

<script>
const form = document.getElementById("registerForm");

const nameInput = document.getElementById("name");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const confirmInput = document.getElementById("confirmPassword");
const phoneInput = document.getElementById("phone");
const agreementInput = document.getElementById("agreement");

const message = document.getElementById("message");
const studentResult = document.getElementById("studentResult");

// Display errors
function showError(input, errorId, text) {
    const error = document.getElementById(errorId);

    error.textContent = text;
    error.hidden = !text;

    if (input) {
        input.setAttribute("aria-invalid", String(Boolean(text)));
    }

    return !text;
}

// Update coding experience
const experience = document.getElementById("experience");
const experienceValue = document.getElementById("experienceValue");

experience.addEventListener("input", function() {
    experienceValue.textContent =
        experience.value + (experience.value == 1 ? " year" : " years");
});

// Check all form fields
function validateForm() {
    let valid = true;
    let firstInvalid = null;

    function check(input, errorId, errorText) {
        const result = showError(input, errorId, errorText);

        if (!result) {
            valid = false;

            if (!firstInvalid) {
                firstInvalid = input;
            }
        }
    }

    // Name validation
    if (nameInput.value.trim().length < 2) {
        check(nameInput, "nameError", "Enter your full name.");
    } else {
        check(nameInput, "nameError", "");
    }

    // Email validation
    const email = emailInput.value.trim();
    const allowedDomains = [
        "gachon.ac.kr",
        "snu.ac.kr",
        "kaist.ac.kr"
    ];

    const emailParts = email.split("@");
    const emailValid =
        emailParts.length === 2 &&
        emailParts[0].length > 0 &&
        allowedDomains.includes(emailParts[1].toLowerCase()) &&
        emailInput.validity.valid;

    if (!emailValid) {
        check(emailInput, "emailError",
            "Use a valid institutional email address.");
    } else {
        check(emailInput, "emailError", "");
    }

    // Password validation
    if (passwordInput.value.length < 8) {
        check(passwordInput, "passwordError",
            "Password must contain at least 8 characters.");
    } else {
        check(passwordInput, "passwordError", "");
    }

    // Confirm password
    if (confirmInput.value !== passwordInput.value ||
        confirmInput.value === "") {
        check(confirmInput, "confirmError",
            "Passwords do not match.");
    } else {
        check(confirmInput, "confirmError", "");
    }

    // Optional phone validation
    if (phoneInput.value && !phoneInput.validity.valid) {
        check(phoneInput, "phoneError",
            "Use the format 010-1234-5678.");
    } else {
        check(phoneInput, "phoneError", "");
    }

    // Agreement validation
    if (!agreementInput.checked) {
        showError(null, "agreementError",
            "You must agree to the registration terms.");
        valid = false;

        if (!firstInvalid) {
            firstInvalid = agreementInput;
        }
    } else {
        showError(null, "agreementError", "");
    }

    return { valid, firstInvalid };
}

// Submit form
form.addEventListener("submit", function(event) {
    event.preventDefault();

    studentResult.textContent = "";

    const result = validateForm();

    if (!result.valid) {
        message.className = "fail";
        message.textContent =
            "Please correct the errors before registering.";

        result.firstInvalid.focus();
        return;
    }

    // Generate student ID
    const studentID =
        "STU" + Math.floor(100000 + Math.random() * 900000);

    message.className = "success";
    message.textContent =
        "Registration successful! Welcome to the program.";

    studentResult.textContent =
        "Your Student ID: " + studentID;

    console.log("Registration successful:", studentID);
});

// Validate again when fields change
[nameInput, emailInput, passwordInput,
 confirmInput, phoneInput].forEach(function(input) {
    input.addEventListener("input", function() {
        if (input.hasAttribute("aria-invalid")) {
            validateForm();
        }
    });
});

// Reset form
form.addEventListener("reset", function() {
    setTimeout(function() {
        document.querySelectorAll(".error").forEach(function(error) {
            error.textContent = "";
            error.hidden = true;
        });

        document.querySelectorAll("[aria-invalid]").forEach(function(input) {
            input.removeAttribute("aria-invalid");
        });

        message.textContent = "";
        message.className = "";
        studentResult.textContent = "";

        experienceValue.textContent =
            experience.value + (experience.value == 1 ? " year" : " years");
    }, 0);
});
</script>

</body>
</html>
